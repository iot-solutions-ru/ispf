# BL-141: OT driver interop lab fixtures (Modbus TCP, MQTT, OPC UA, SNMP, HTTP, BACnet, IEC 104).
# Bind to loopback only — do not expose on public interfaces.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ispf-interop-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  modbus-tcp:
    # Writable holding-register fixture (FC3/FC6/FC16). Replaces oitc/modbus-server
    # which reset the TCP session on FC6 in CI (OT Trust Wave 1 / B1).
    image: python:3.12-alpine
    container_name: ispf-interop-modbus-tcp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./modbus/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "502"]
    ports:
      - "127.0.0.1:502:502"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',502),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  opcua:
    # Microsoft OPC PLC (.NET). SecurityPolicy.None + anonymous via --autoaccept/--sph.
    # No in-container healthcheck: runtime tags are often shell-less (or lack bash
    # /dev/tcp), so a probe here permanently marks the service unhealthy and breaks
    # `docker compose --wait`. Host-side readiness is enforced by
    # deploy/tools/driver-interop-smoke.sh (TCP wait on 127.0.0.1:4840).
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: ispf-interop-opcua
    restart: unless-stopped
    command:
      - --pn=4840
      - --autoaccept
      - --sph
      - --sn=5
      - --sr=10
      - --st=uint
      - --fn=5
      - --fr=1
    ports:
      - "127.0.0.1:4840:4840"

  snmp:
    # Minimal SNMPv2c GET/SET lab agent (stdlib). Not a production snmpd.
    # Writable OID: 1.3.6.1.4.1.99999.1.1.0 (Integer32). Community: public.
    image: python:3.12-alpine
    container_name: ispf-interop-snmp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./snmp/agent.py:/app/agent.py:ro
    command: ["python", "-u", "/app/agent.py", "--host", "0.0.0.0", "--port", "161"]
    ports:
      - "127.0.0.1:161:161/udp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.path.insert(0,'.'); from agent import snmp_get, OID_LAB_GAUGE; snmp_get('127.0.0.1',161,OID_LAB_GAUGE)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  http:
    # Writable JSON gauge fixture for HTTP driver smoke (GET/PUT /points/gauge).
    image: python:3.12-alpine
    container_name: ispf-interop-http
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./http/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "8089"]
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  bacnet:
    # Minimal BACnet/IP UDP lab agent (stdlib). Not a production BACnet stack.
    # Device 1001; writable analog-value:1 present-value (REAL). Port 47808/udp.
    image: python:3.12-alpine
    container_name: ispf-interop-bacnet
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./bacnet/agent.py:/app/agent.py:ro
    command: ["python", "-u", "/app/agent.py", "--host", "0.0.0.0", "--port", "47808"]
    ports:
      - "127.0.0.1:47808:47808/udp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.path.insert(0,'.'); from agent import bacnet_read; bacnet_read('127.0.0.1',47808)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  iec104:
    # Minimal IEC 60870-5-104 TCP outstation (stdlib). Not a production stack.
    # CA=1; writable IOA 3001 FLOAT (M_ME_NC_1), seed 42.5. Port 2404.
    image: python:3.12-alpine
    container_name: ispf-interop-iec104
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./iec104/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "2404"]
    ports:
      - "127.0.0.1:2404:2404"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',2404),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
