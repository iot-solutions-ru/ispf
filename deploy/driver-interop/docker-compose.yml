# BL-141: OT driver interop lab fixtures (Modbus TCP/UDP/RTU, MQTT, OPC UA, SNMP, HTTP,
# BACnet, IEC 104, EtherNet/IP, DLMS, DNP3, S7 SoftPlc, GPS tracker). Bind to loopback only.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ispf-interop-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  modbus-tcp:
    # Writable holding-register fixture (FC3/FC6/FC16). Replaces oitc/modbus-server
    # which reset the TCP session on FC6 in CI (OT Trust Wave 1 / B1).
    image: python:3.12-alpine
    container_name: ispf-interop-modbus-tcp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./modbus/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "502"]
    ports:
      - "127.0.0.1:502:502"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',502),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  modbus-udp:
    # Same stdlib fixture as modbus-tcp, UDP transport (MBAP+PDU datagrams).
    # Seed holdings [0x1111,0x2222,0x3333]. Host port 502/udp (alongside TCP 502).
    image: python:3.12-alpine
    container_name: ispf-interop-modbus-udp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./modbus/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "502", "--udp"]
    ports:
      - "127.0.0.1:502:502/udp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.path.insert(0,'.'); from server import udp_probe; udp_probe('127.0.0.1',502)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  opcua:
    # Microsoft OPC PLC (.NET). SecurityPolicy.None + anonymous via --autoaccept/--sph.
    # No in-container healthcheck: runtime tags are often shell-less (or lack bash
    # /dev/tcp), so a probe here permanently marks the service unhealthy and breaks
    # `docker compose --wait`. Host-side readiness is enforced by
    # deploy/tools/driver-interop-smoke.sh (TCP wait on 127.0.0.1:4840).
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: ispf-interop-opcua
    restart: unless-stopped
    command:
      - --pn=4840
      - --autoaccept
      - --sph
      - --sn=5
      - --sr=10
      - --st=uint
      - --fn=5
      - --fr=1
    ports:
      - "127.0.0.1:4840:4840"

  snmp:
    # Minimal SNMPv2c GET/SET lab agent (stdlib). Not a production snmpd.
    # Writable OID: 1.3.6.1.4.1.99999.1.1.0 (Integer32). Community: public.
    image: python:3.12-alpine
    container_name: ispf-interop-snmp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./snmp/agent.py:/app/agent.py:ro
    command: ["python", "-u", "/app/agent.py", "--host", "0.0.0.0", "--port", "161"]
    ports:
      - "127.0.0.1:161:161/udp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.path.insert(0,'.'); from agent import snmp_get, OID_LAB_GAUGE; snmp_get('127.0.0.1',161,OID_LAB_GAUGE)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  http:
    # Writable JSON gauge fixture for HTTP driver smoke (GET/PUT /points/gauge).
    image: python:3.12-alpine
    container_name: ispf-interop-http
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./http/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "8089"]
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  bacnet:
    # Minimal BACnet/IP UDP lab agent (stdlib). Not a production BACnet stack.
    # Device 1001; writable analog-value:1 present-value (REAL). Port 47808/udp.
    image: python:3.12-alpine
    container_name: ispf-interop-bacnet
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./bacnet/agent.py:/app/agent.py:ro
    command: ["python", "-u", "/app/agent.py", "--host", "0.0.0.0", "--port", "47808"]
    ports:
      - "127.0.0.1:47808:47808/udp"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.path.insert(0,'.'); from agent import bacnet_read; bacnet_read('127.0.0.1',47808)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  iec104:
    # Minimal IEC 60870-5-104 TCP outstation (stdlib). Not a production stack.
    # CA=1; writable IOA 3001 FLOAT (M_ME_NC_1), seed 42.5. Port 2404.
    image: python:3.12-alpine
    container_name: ispf-interop-iec104
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./iec104/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "2404"]
    ports:
      - "127.0.0.1:2404:2404"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',2404),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  ethernet-ip:
    # Minimal EtherNet/IP CIP UCMM peer (stdlib). Not a production EIP stack.
    # Tag Program:MainProgram.Counter (DINT), seed 12345678. Port 44818.
    image: python:3.12-alpine
    container_name: ispf-interop-ethernet-ip
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./ethernet-ip/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "44818"]
    ports:
      - "127.0.0.1:44818:44818"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',44818),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  dlms:
    # Minimal DLMS TCP WRAPPER peer (stdlib). Not a production DLMS/COSEM stack.
    # REGISTER 1.0.1.8.0.255 attr 2, seed 42.0. Port 4059. Client SAP 16.
    image: python:3.12-alpine
    container_name: ispf-interop-dlms
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dlms/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "4059"]
    ports:
      - "127.0.0.1:4059:4059"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',4059),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  dnp3:
    # Minimal DNP3 TCP outstation (stdlib ISPF subset). Poll-only — ADR-0057.
    # Master=1, outstation=1024; seed AI0=12.34 / BI0=true / CTR0=999. Port 20000.
    image: python:3.12-alpine
    container_name: ispf-interop-dnp3
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dnp3/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "20000"]
    ports:
      - "127.0.0.1:20000:20000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',20000),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  s7:
    # SoftPlc (Snap7) lab peer for TOP-20 s7. Not a Siemens PLC / field cert.
    # ISO-on-TCP :102 (rack 0 / slot 2) + REST :8080. Demodata DB1 REAL @ offset 80.
    # No in-container healthcheck (image may be shell-light); host smoke waits TCP+API.
    image: fbarresi/softplc:latest-linux
    container_name: ispf-interop-s7
    restart: unless-stopped
    environment:
      DATA_PATH: /demodata
    ports:
      - "127.0.0.1:102:102"
      - "127.0.0.1:8080:8080"

  modbus-rtu:
    # Same stdlib fixture as modbus-tcp, RTU ADU framing (unit+PDU+CRC16) over TCP.
    # Lab serial-server bridge — not RS-485 PHY / PTY. Host port 5020.
    # Seed holdings [0x1111,0x2222,0x3333]. FC3/FC6/FC16.
    image: python:3.12-alpine
    container_name: ispf-interop-modbus-rtu
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./modbus/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "5020", "--rtu"]
    ports:
      - "127.0.0.1:5020:5020"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.path.insert(0,'.'); from server import rtu_probe; rtu_probe('127.0.0.1',5020)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  gps-tracker:
    # Lab stand-in for TOP-20 gps-tracker listen path (line-oriented NMEA over TCP).
    # Java driver is the real listener; this fixture mirrors accept/read-line + /last API.
    # Not a GNSS modem / field tracker. Host :5005 (NMEA) + :5006 (HTTP status).
    image: python:3.12-alpine
    container_name: ispf-interop-gps-tracker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./gps-tracker/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "5005", "--api-port", "5006"]
    ports:
      - "127.0.0.1:5005:5005"
      - "127.0.0.1:5006:5006"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
