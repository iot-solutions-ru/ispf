# BL-141: OT driver interop lab fixtures (Modbus TCP, MQTT, OPC UA).
# Bind to loopback only — do not expose on public interfaces.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ispf-interop-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  modbus-tcp:
    # Writable holding-register fixture (FC3/FC6/FC16). Replaces oitc/modbus-server
    # which reset the TCP session on FC6 in CI (OT Trust Wave 1 / B1).
    image: python:3.12-alpine
    container_name: ispf-interop-modbus-tcp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./modbus/server.py:/app/server.py:ro
    command: ["python", "-u", "/app/server.py", "--host", "0.0.0.0", "--port", "502"]
    ports:
      - "127.0.0.1:502:502"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',502),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  opcua:
    # Microsoft OPC PLC (.NET). SecurityPolicy.None + anonymous via --autoaccept/--sph.
    # No in-container healthcheck: runtime tags are often shell-less (or lack bash
    # /dev/tcp), so a probe here permanently marks the service unhealthy and breaks
    # `docker compose --wait`. Host-side readiness is enforced by
    # deploy/tools/driver-interop-smoke.sh (TCP wait on 127.0.0.1:4840).
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: ispf-interop-opcua
    restart: unless-stopped
    command:
      - --pn=4840
      - --autoaccept
      - --sph
      - --sn=5
      - --sr=10
      - --st=uint
      - --fn=5
      - --fr=1
    ports:
      - "127.0.0.1:4840:4840"
