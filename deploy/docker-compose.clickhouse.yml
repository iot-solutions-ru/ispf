# Local ClickHouse for event journal throughput testing (P3b).
# Usage:
#   docker compose -f deploy/docker-compose.clickhouse.yml up -d
#   ISPF_EVENT_JOURNAL_STORE=clickhouse
#   ISPF_EVENT_JOURNAL_CLICKHOUSE_URL=http://localhost:8123
#
# VPS: mount clickhouse-local-user.xml + system-logs-production.xml (log TTL).
# Password in clickhouse-local-user.xml must match ISPF_*_CLICKHOUSE_PASSWORD in ispf-server.env.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ispf-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-local-user.xml:/etc/clickhouse-server/users.d/ispf-local.xml:ro
      - ./clickhouse-config/system-logs-production.xml:/etc/clickhouse-server/config.d/system-logs-production.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clickhouse-data:
