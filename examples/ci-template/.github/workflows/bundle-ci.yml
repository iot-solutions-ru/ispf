name: ISPF bundle validate

on:
  push:
    paths:
      - "**/bundle.json"
      - ".github/workflows/bundle-ci.yml"
  pull_request:
    paths:
      - "**/bundle.json"
  workflow_dispatch:

jobs:
  validate-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate bundle manifest
        env:
          ISPF_BASE_URL: ${{ secrets.ISPF_BASE_URL }}
          ISPF_API_TOKEN: ${{ secrets.ISPF_API_TOKEN }}
          BUNDLE_PATH: examples/warehouse-app/bundle.json
          APP_ID: warehouse
        run: |
          if [ ! -f tools/ispf-cli/package.json ]; then
            echo "tools/ispf-cli is not in this checkout. Install the ISPF CLI and point this step at it."
            exit 1
          fi
          npm ci --prefix tools/ispf-cli
          CLI="node tools/ispf-cli/bin/ispf.mjs"
          if [ -z "$ISPF_BASE_URL" ]; then
            echo "ISPF_BASE_URL is not set — checking schema and ship-canon only"
            $CLI validate "$BUNDLE_PATH" --local --strict
          else
            $CLI validate "$BUNDLE_PATH" --app "$APP_ID" --strict
          fi
