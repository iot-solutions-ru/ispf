<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Pack Demo</title>
  <base href="/apps/ui-pack-demo/" />
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0; display: grid; place-items: center; }
    main { max-width: 36rem; padding: 2rem; border: 1px solid #334155; border-radius: 12px; background: #1e293b; }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { margin: 0.5rem 0; line-height: 1.5; color: #cbd5e1; }
    code { background: #0f172a; padding: 0.1rem 0.35rem; border-radius: 4px; }
    button { margin-top: 1rem; padding: 0.55rem 1rem; border: 0; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
    #out { margin-top: 1rem; white-space: pre-wrap; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>Hosted UI pack</h1>
    <p>This static page is served by ISPF from <code>ISPF_UI_PACKS_DIR</code> at <code>/apps/ui-pack-demo/</code> (ADR-0054).</p>
    <p>SPA authors should set Vite <code>base: '/apps/&lt;appId&gt;/'</code> and call <code>/api/v1</code> same-origin.</p>
    <button type="button" id="ping">Ping /api/v1/info</button>
    <pre id="out"></pre>
  </main>
  <script>
    document.getElementById("ping").addEventListener("click", async () => {
      const out = document.getElementById("out");
      out.textContent = "Loading…";
      try {
        const res = await fetch("/api/v1/info");
        const text = await res.text();
        out.textContent = res.status + "\n" + text.slice(0, 800);
      } catch (err) {
        out.textContent = String(err);
      }
    });
  </script>
</body>
</html>
