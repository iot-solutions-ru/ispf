openapi: 3.0.3
info:
  title: Ойл Контроль — BFF Contract
  version: 0.4.0
  description: |
    Контракт React SPA ↔ ISPF application `oil-control` (контур АЗС).
    Все вызовы бизнес-логики идут через BFF invoke на hub-объект.
servers:
  - url: https://ispf.iot-solutions.ru
    description: Shared ISPF stand
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: bff
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login (local profile)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: admin }
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  username: { type: string }
                  roles:
                    type: array
                    items: { type: string }
  /api/v1/bff/invoke:
    post:
      tags: [bff]
      summary: Invoke oil-control hub function
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BffInvokeRequest"
      responses:
        "200":
          description: Wire response (anima-operator-v1 compatible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BffInvokeResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    BffInvokeRequest:
      type: object
      required: [objectPath, functionName, input]
      properties:
        objectPath:
          type: string
          enum: [root.platform.devices.oil-control.hub]
        functionName:
          type: string
          enum:
            - oc_calcBalance
            - oc_createIncident
            - oc_createWorkOrder
            - oc_getCalibrationProfile
            - oc_getStation
            - oc_importCalibration
            - oc_listAnomalies
            - oc_listAssets
            - oc_listB2BOrders
            - oc_listBalanceTrend
            - oc_listBatches
            - oc_listCalibrations
            - oc_listDischargeSessions
            - oc_listDischargeTanks
            - oc_listImbalanceByAzs
            - oc_listImbalances
            - oc_listIncidents
            - oc_listKpiCards
            - oc_listKpiIncidentSummary
            - oc_listKpiReports
            - oc_listLabSamples
            - oc_listQualityPassports
            - oc_createLabSample
            - oc_updateLabSampleStatus
            - oc_listMeasurements
            - oc_listMonitorEvents
            - oc_listRegionFuels
            - oc_listRegions
            - oc_listRgsTrk
            - oc_listRgsTrkSeries
            - oc_listStationJournal
            - oc_listStationPumps
            - oc_listStationTanks
            - oc_listStations
            - oc_listStockForecast
            - oc_listTankStocks
            - oc_listTanks
            - oc_listVehicles
            - oc_listWagonTrips
            - oc_listWorkOrders
            - oc_listZones
            - oc_resolveVolume
            - oc_submitMeasurement
            - oc_updateAssetStatus
            - oc_updateIncidentStatus
            - oc_updateWorkOrderStatus
        input:
          type: object
          required: [schema, rows]
          properties:
            schema:
              type: object
              properties:
                name: { type: string, example: in }
                fields:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      type: { type: string }
            rows:
              type: array
              items:
                type: object
                additionalProperties: true
    BffInvokeResponse:
      type: object
      properties:
        error_code: { type: string, example: OK }
        error_message: { type: string }
        result:
          description: Scalar map or { rows: [...] } for list functions
          oneOf:
            - type: object
            - type: array
              items: { type: object }
    Tank:
      type: object
      properties:
        tank_code: { type: string }
        display_name: { type: string }
        site_code: { type: string }
        tank_kind: { type: string }
        max_level_cm: { type: number }
        active: { type: boolean }
        product_code: { type: string }
        azs_code: { type: string }
        tank_no: { type: integer }
    Zone:
      type: object
      properties:
        zone_code: { type: string }
        display_name: { type: string }
        site_code: { type: string }
        inflow_desc: { type: string }
        outflow_desc: { type: string }
        calc_period: { type: string }
        loss_norm_pct: { type: number }
    MeasurementInput:
      type: object
      required: [tankCode, levelCm, temperatureC, operatorName]
      properties:
        tankCode: { type: string }
        levelCm: { type: string, description: "Numeric as string for script engine" }
        temperatureC: { type: string }
        operatorName: { type: string }
        measuredAt: { type: string }
        lat: { type: string }
        lon: { type: string }
        note: { type: string }
    BalanceRow:
      type: object
      properties:
        zone_code: { type: string }
        display_name: { type: string }
        loss_norm_pct: { type: number }
        imbalance_pct: { type: number }
        imbalance_l: { type: number }
        status: { type: string, enum: [green, yellow, red] }
        stock_end_l: { type: number }
        note: { type: string }

