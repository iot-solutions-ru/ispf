name: CI (pr-fast)

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      drivers: ${{ steps.filter.outputs.drivers }}
      web_console: ${{ steps.filter.outputs.web_console }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Positive-only globs: pinned paths-filter only supports predicate-quantifier
          # every|some, and with 'some' a '!glob' matches almost every file (UI-only PRs
          # incorrectly started backend). Omit gradle/driver-packs.json on purpose.
          filters: |
            backend:
              - 'packages/ispf-server/**'
              - 'packages/ispf-persistence/**'
              - 'packages/ispf-server-spi/**'
              - 'packages/ispf-server-config/**'
              - 'packages/ispf-license/**'
              - 'packages/ispf-concurrent/**'
              - 'packages/ispf-server-driver/**'
              - 'packages/ispf-server-workflow/**'
              - 'packages/ispf-core/**'
              - 'packages/ispf-expression/**'
              - 'packages/ispf-export-parquet/**'
              - 'packages/ispf-ai-*/**'
              - 'packages/ispf-analytics-*/**'
              - 'packages/ispf-plugin-*/**'
              - 'packages/ispf-driver-api/**'
              - 'buildSrc/**'
              - 'gradle/wrapper/**'
              - 'gradle/driver-pack-deploy-profiles.json'
              - 'gradlew'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'tools/ai-pack/**'
              - 'tools/license-audit/**'
              - 'tools/agent-regression/**'
              - 'tools/ship-canon-fixtures/**'
              - 'tools/mssql-*.py'
              - 'docs/en/mssql-flyway-exceptions.txt'
              - 'tools/mysql-*.py'
              - 'docs/en/mysql-flyway-exceptions.txt'
              - 'examples/**'
            drivers:
              - 'packages/ispf-driver-*/**'
              - 'gradle.properties'
              - 'packages/ispf-core/**'
              - 'packages/ispf-driver-api/**'
              - 'gradle/driver-packs.json'
              - 'buildSrc/src/main/kotlin/com/ispf/build/**'
              - 'buildSrc/src/main/resources/META-INF/gradle-plugins/ispf-driver-pack.properties'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
            web_console:
              - 'apps/web-console/**'
              - 'tools/symbol-pack-isa/**'
            tools:
              - 'tools/ai-pack/**'
              - 'tools/license-audit/**'
              - 'tools/agent-regression/**'

  driver-packs:
    needs: changes
    if: needs.changes.outputs.drivers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore dev driver packs
        uses: actions/cache/restore@v6
        id: driver-packs-cache
        with:
          path: build/driver-packs
          key: driver-packs-dev-${{ hashFiles('gradle/driver-packs.json', 'build.gradle.kts', 'buildSrc/**', 'packages/ispf-driver-virtual/**', 'packages/ispf-driver-mqtt/**', 'packages/ispf-driver-modbus/**', 'packages/ispf-driver-http/**', 'packages/ispf-driver-cwmp/**', 'packages/ispf-driver-flexible/**', 'packages/ispf-driver-gps-tracker/**', 'packages/ispf-driver-application/**', 'packages/ispf-driver-jdbc/**') }}
          restore-keys: |
            driver-packs-dev-

      - name: Test and sync dev driver packs
        env:
          ISPF_DRIVER_PACKS_PREBUILT: ${{ steps.driver-packs-cache.outputs.cache-hit }}
        run: >
          ./gradlew
          testDevDriverPacks
          syncDevDriverPacks
          --no-daemon
          -Dorg.gradle.workers.max=1
          -Dispf.driver.packs=dev

      - name: Smoke out-of-tree DDK template
        run: |
          set -euo pipefail
          ./gradlew publishDdkApi --no-daemon
          TEMPLATE_DIR="${RUNNER_TEMP}/ddk-template"
          rm -rf "$TEMPLATE_DIR"
          cp -a packages/ispf-driver-ddk/template "$TEMPLATE_DIR"
          ./gradlew -p "$TEMPLATE_DIR" test assembleDriverPack --no-daemon
          test -f "$TEMPLATE_DIR/build/driver-pack/ispf-driver-acme-widget/driver-pack.json"
          test -f "$TEMPLATE_DIR/build/driver-pack/ispf-driver-acme-widget/ispf-driver-acme-widget.jar"

      - name: Save dev driver packs
        if: steps.driver-packs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/driver-packs
          key: driver-packs-dev-${{ hashFiles('gradle/driver-packs.json', 'build.gradle.kts', 'buildSrc/**', 'packages/ispf-driver-virtual/**', 'packages/ispf-driver-mqtt/**', 'packages/ispf-driver-modbus/**', 'packages/ispf-driver-http/**', 'packages/ispf-driver-cwmp/**', 'packages/ispf-driver-flexible/**', 'packages/ispf-driver-gps-tracker/**', 'packages/ispf-driver-application/**', 'packages/ispf-driver-jdbc/**') }}

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Build AI context pack
        run: ISPF_VERSION=0.9.2 python tools/ai-pack/build.py

      - name: License compliance audit
        run: node tools/license-audit/check-all.mjs

      - name: MSSQL Flyway lockstep (ADR-0078 Phase 4)
        run: python tools/mssql-flyway-lockstep-check.py

      - name: MySQL Flyway lockstep (ADR-0079)
        run: python tools/mysql-flyway-lockstep-check.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore dev driver packs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: driver-packs-cache
        with:
          path: build/driver-packs
          key: driver-packs-dev-${{ hashFiles('gradle/driver-packs.json', 'build.gradle.kts', 'buildSrc/**', 'packages/ispf-driver-virtual/**', 'packages/ispf-driver-mqtt/**', 'packages/ispf-driver-modbus/**', 'packages/ispf-driver-http/**', 'packages/ispf-driver-cwmp/**', 'packages/ispf-driver-flexible/**', 'packages/ispf-driver-gps-tracker/**', 'packages/ispf-driver-application/**', 'packages/ispf-driver-jdbc/**') }}
          restore-keys: |
            driver-packs-dev-

      - name: Test core platform modules (skip load)
        env:
          ISPF_DRIVER_PACKS_PREBUILT: ${{ steps.driver-packs-cache.outputs.cache-hit }}
          # Soften SpringBootTest JVM churn vs forkEvery=1 (~1h); raise to 1 if flakes return.
          ISPF_TEST_FORK_EVERY: "5"
        run: >
          ./gradlew
          testPrFast
          --no-daemon
          -Dorg.gradle.workers.max=2
          -Dispf.test.skipLoad=true
          -Dispf.test.skipFederation=true
          -Dispf.driver.packs=dev

      - name: Coverage report (JaCoCo)
        if: always()
        run: ./gradlew coverageReport --no-daemon -q || true

      # Per-module LINE/BRANCH floors live in coverageFloors (build.gradle.kts). Ratchet up, never down.
      - name: Coverage gate (JaCoCo floors)
        run: ./gradlew coverageVerify --no-daemon

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-prfast
          path: packages/*/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Save dev driver packs
        if: steps.driver-packs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/driver-packs
          key: driver-packs-dev-${{ hashFiles('gradle/driver-packs.json', 'build.gradle.kts', 'buildSrc/**', 'packages/ispf-driver-virtual/**', 'packages/ispf-driver-mqtt/**', 'packages/ispf-driver-modbus/**', 'packages/ispf-driver-http/**', 'packages/ispf-driver-cwmp/**', 'packages/ispf-driver-flexible/**', 'packages/ispf-driver-gps-tracker/**', 'packages/ispf-driver-application/**', 'packages/ispf-driver-jdbc/**') }}

  web-console:
    needs: changes
    if: needs.changes.outputs.web_console == 'true' || needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # jsdom 30 requires ^22.22.2 (or newer LTS lines).
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: apps/web-console/package-lock.json

      - name: License compliance audit
        run: node tools/license-audit/check-all.mjs

      - name: Build ISA P&ID symbol pack
        if: needs.changes.outputs.web_console == 'true'
        run: |
          cd tools/symbol-pack-isa
          npm ci
          npm test
          npm run build

      - name: Lint, unit tests, i18n gate, build
        working-directory: apps/web-console
        run: |
          npm ci
          npm run lint
          npm test
          npm run i18n:check
          npm run build
          test -f dist/legal/LICENSE
          test -f dist/legal/THIRD_PARTY_NOTICES.md

  marketplace-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.2"

      - name: Validate marketplace-catalog bundles (BL-183)
        run: node tools/marketplace-catalog/validate-catalog.mjs

      - name: ispf-cli unit tests
        working-directory: tools/ispf-cli
        run: |
          npm ci
          node --test test/*.test.mjs

      - name: Validate example bundles (local --strict)
        run: node tools/ispf-cli/scripts/validate-examples.mjs

      - name: Marketplace ship-canon gate + shared fixtures
        run: node --test tools/marketplace-catalog/*.test.mjs

      - name: Tracked binaries / oversized files gate
        run: node tools/repo-hygiene/check-tracked-binaries.mjs

  examples-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Examples folder has a README and an index link
        run: python tools/examples-index/check_examples_index.py

  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.14.4

      - name: Helm lint + template smoke (BL-186)
        run: bash deploy/helm/ispf/validate.sh

      - name: vps-single-rollout pipefail smoke
        run: bash deploy/tools/single-rollout-pipefail-smoke.sh

  agent-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.22.2"

      - name: Validate agent-regression scenario schemas (BL-178)
        run: node tools/agent-regression/validate-scenarios.mjs

      - name: Context-pack outbox honesty (simulated ≠ sent)
        run: bash tools/ai-pack/check-outbox-honesty.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Restore dev driver packs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: driver-packs-cache
        with:
          path: build/driver-packs
          key: driver-packs-dev-${{ hashFiles('gradle/driver-packs.json', 'build.gradle.kts', 'buildSrc/**', 'packages/ispf-driver-virtual/**', 'packages/ispf-driver-mqtt/**', 'packages/ispf-driver-modbus/**', 'packages/ispf-driver-http/**', 'packages/ispf-driver-cwmp/**', 'packages/ispf-driver-flexible/**', 'packages/ispf-driver-gps-tracker/**', 'packages/ispf-driver-application/**', 'packages/ispf-driver-jdbc/**') }}
          restore-keys: |
            driver-packs-dev-

      - name: AgentRegressionCiTest (Java schema gate)
        env:
          ISPF_DRIVER_PACKS_PREBUILT: ${{ steps.driver-packs-cache.outputs.cache-hit }}
        run: >
          ./gradlew
          :packages:ispf-ai-agent:test
          --tests com.ispf.server.ai.agent.AgentRegressionCiTest
          --no-daemon
          -Dorg.gradle.workers.max=1
          -Dispf.test.skipLoad=true
          -Dispf.test.skipFederation=true
          -Dispf.driver.packs=dev

      - name: Save dev driver packs
        if: steps.driver-packs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/driver-packs
          key: driver-packs-dev-${{ hashFiles('gradle/driver-packs.json', 'build.gradle.kts', 'buildSrc/**', 'packages/ispf-driver-virtual/**', 'packages/ispf-driver-mqtt/**', 'packages/ispf-driver-modbus/**', 'packages/ispf-driver-http/**', 'packages/ispf-driver-cwmp/**', 'packages/ispf-driver-flexible/**', 'packages/ispf-driver-gps-tracker/**', 'packages/ispf-driver-application/**', 'packages/ispf-driver-jdbc/**') }}

  pr-fast-ok:
    needs: [changes, backend, driver-packs, web-console, agent-regression, marketplace-catalog, helm-chart, examples-index]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful pr-fast jobs
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "driver-packs=${{ needs.driver-packs.result }}"
          echo "web-console=${{ needs.web-console.result }}"
          echo "agent-regression=${{ needs.agent-regression.result }}"
          echo "marketplace-catalog=${{ needs.marketplace-catalog.result }}"
          echo "helm-chart=${{ needs.helm-chart.result }}"
          echo "examples-index=${{ needs.examples-index.result }}"
          if [[ "${{ needs.backend.result }}" == "failure"
             || "${{ needs.driver-packs.result }}" == "failure"
             || "${{ needs.web-console.result }}" == "failure"
             || "${{ needs.agent-regression.result }}" == "failure"
             || "${{ needs.marketplace-catalog.result }}" == "failure"
             || "${{ needs.helm-chart.result }}" == "failure"
             || "${{ needs.examples-index.result }}" == "failure" ]]; then
            echo "pr-fast failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "cancelled"
             || "${{ needs.driver-packs.result }}" == "cancelled"
             || "${{ needs.web-console.result }}" == "cancelled"
             || "${{ needs.agent-regression.result }}" == "cancelled"
             || "${{ needs.marketplace-catalog.result }}" == "cancelled"
             || "${{ needs.helm-chart.result }}" == "cancelled"
             || "${{ needs.examples-index.result }}" == "cancelled" ]]; then
            exit 1
          fi
          echo "pr-fast passed (skipped jobs are OK for path-only changes)"
