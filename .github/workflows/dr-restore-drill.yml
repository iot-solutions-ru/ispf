# Lab T2 Postgres dump→restore drill (ADR-0068). Not site DR.
name: DR restore drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/tools/dr-restore-drill.sh"
      - ".github/workflows/dr-restore-drill.yml"
      - "docs/evidence/dr-restore/**"

permissions:
  contents: read

jobs:
  t2-dump-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run T2 restore drill
        run: bash deploy/tools/dr-restore-drill.sh

      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dr-restore-drill
          path: build/dr-restore-drill/transcript.md
          if-no-files-found: warn
