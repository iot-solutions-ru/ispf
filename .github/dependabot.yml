# Dependabot version updates (weekly). Touch this file to re-run update jobs.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    # YARG XlsxFormatter needs docx4j 8.3.x; majors break template validation (ADR-0053).
    ignore:
      - dependency-name: "org.docx4j:docx4j-JAXB-ReferenceImpl"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/web-console
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
